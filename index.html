<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Clima - API & Mapa</title>
    <!-- CSS do Mapa (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-principal">
        <h1>Previsão do Tempo + Mapa</h1>
        
        <!-- Barra de busca -->
        <div class="busca-container">
            <input type="text" id="inputCidade" placeholder="Qual cidade você quer buscar?">
            <button id="btnBuscar">Buscar</button>
        </div>

        <!-- Onde aparecem as mensagens e avisos -->
        <div class="aviso"></div>

        <!-- Área dos resultados de clima (começa escondida) -->
        <div class="resultado" style="display: none;">
            <div class="titulo"></div>
            <div class="info-clima">
                <div class="temperatura-box">
                    <img class="climaImg" src="" alt="Status do clima">
                    <div class="tempInfo"></div>
                </div>
                <div class="detalhes-box">
                    <p>💨 Vento: <span class="ventoInfo"></span></p>
                    <p class="climaDescricao" style="text-transform: capitalize; color: #38bdf8; font-weight: bold; margin-top: 5px;"></p>
                </div>
            </div>
        </div>

        <!-- Onde o mapa vai carregar -->
        <div id="map"></div>
    </div>

    <!-- Script do Leaflet pra carregar o mapa -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
